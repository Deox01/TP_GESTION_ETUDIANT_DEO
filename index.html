<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Système de gestion des étudiants</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="container">
        <div class="header">
          <div class="title">
            <h1>Afrix Global</h1>
            <p>Système de gestion des étudiants</p>
          </div>
          <div class="info">
            <div class="profil"><h2 class="initial">JO</h2></div>
            <span class="name">Jonathan</span>
          </div>
        </div>
        <div class="body-container">
          <div class="navbar">
            <button class="resultat-btn">Afficher les résultats</button>
            <button class="frais-btn">Vérifier les frais scolaires</button>
            <button class="acces-examen">Vérifier l'accès à l'examen</button>
            <button class="edit-montant">Modifier le montant payé</button>
          </div>
          <div class="info-body">
            <h1>Bienvenue cher Afrix team.</h1>
            <p class="presentation">Consulter les infos concernant l'etudiant <span class="name-etudiant"></span> sur une place !</p>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
